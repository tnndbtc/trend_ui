version: '3.8'

services:
  trend-ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Point to your crawler API
      - NEXT_PUBLIC_CRAWLER_API_BASE_URL=http://192.168.86.41:8002/api/v1
    restart: unless-stopped
    container_name: trend-ui
